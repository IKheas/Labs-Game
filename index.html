<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Lab Portfolio</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body{
            min-height:100vh;
            background:#00183d;
            color:#ffffff;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:40px;
        }

        .container{
            width:100%;
            max-width:1100px;
        }

        .header{
            text-align:center;
            margin-bottom:50px;
        }

        .header h1{
            font-size:3rem;
            font-weight:700;
            margin-bottom:10px;
        }

        .header p{
            color:#fffdfd;
            font-size:1.1rem;
        }

        .grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
            gap:25px;
        }

        .card{
            background:#0d3c79;
            padding:30px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.08);
            transition:0.3s;
        }

        .card:hover{
            transform:translateY(-8px);
            box-shadow:0 20px 40px rgba(0,0,0,0.12);
        }

        .card h2{
            margin-bottom:10px;
            font-size:1.5rem;
        }

        .card p{
            color:#ffffff;
            margin-bottom:20px;
        }

        .btn{
            display:inline-block;
            padding:12px 24px;
            border-radius:10px;
            text-decoration:none;
            background:#111827;
            color:white;
            transition:0.3s;
        }

        .btn:hover{
            background:#374151;
        }

        footer{
            text-align:center;
            margin-top:50px;
            color:#a1a1a1;
            font-size: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>LABS INDEX</h1>
    </div>

    <div class="grid">

        <div class="card">
            <h2>Lab 1</h2>
            <p>GODOT 2D SCENE</p>
            <a href="Lab01.html" class="btn">View Lab</a>
        </div>

        <div class="card">
            <h2>Lab 2</h2>
            <p>UNKNOWN</p>
            <a href="" class="btn">View Lab</a>
        </div>

        <div class="card">
            <h2>Lab 3</h2>
            <p>2D Skeleton</p>
            <a href="lab03.html" class="btn">View Lab</a>
        </div>

        <div class="card">
            <h2>Lab 4</h2>
            <p>UNKNOWN</p>
            <a href="" class="btn">View Lab</a>
        </div>

        <div class="card">
            <h2>Lab 5</h2>
            <p>UNKNOWN</p>
            <a href="" class="btn">View Lab</a>
        </div>

        <div class="card">
            <h2>Lab 6</h2>
            <p>UNKNOWN</p>
            <a href="" class="btn">View Lab</a>
        </div>

    </div>

    <footer>
        683380304-5 | นาย ปรเมษฐ์ จันทมิฬ
    </footer>

</div>

</body>
</html>
